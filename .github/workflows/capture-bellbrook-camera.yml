name: Bellbrook camera validation

on:
  schedule:
    # Retain the 15-minute cadence without the busy start-of-hour slot.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-bellbrook-camera.yml'
      - 'scripts/privacy_blur_camera.py'

permissions:
  contents: write

concurrency:
  # Both capture workflows write the same archive and manifest.
  group: bellbrook-capture-publish
  cancel-in-progress: false

jobs:
  validate-current-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Read the latest archive after waiting for the other writer.
          ref: main

      - name: Fetch and validate Bellbrook Bridge JPEG
        shell: bash
        env:
          CAMERA_URL: https://public.disasterwatch-iotp.com.au/prospectpublicimages/1662/Bellbrook%20Bridge.jpeg
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            -H 'Accept: image/jpeg' \
            -H 'User-Agent: Bellbrook-Floodwatch/1.0' \
            -D headers.txt -o bellbrook-source.jpeg "$CAMERA_URL"

          bytes=$(stat -c '%s' bellbrook-source.jpeg)
          test "$bytes" -ge 10000
          test "$bytes" -le 5000000

          mime=$(file --brief --mime-type bellbrook-source.jpeg)
          test "$mime" = image/jpeg

          python3 - <<'PY'
          from pathlib import Path
          p = Path("bellbrook-source.jpeg")
          b = p.read_bytes()
          if not (b.startswith(b"\xff\xd8") and b.endswith(b"\xff\xd9")):
              raise SystemExit("Invalid JPEG markers")
          print(f"validated JPEG: {len(b)} bytes")
          PY

          sha256sum bellbrook-source.jpeg
          printf '\nHTTP response headers:\n'
          cat headers.txt

      - name: Verify source frame
        id: source_frame
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(sha256sum bellbrook-source.jpeg | awk '{print $1}')
          previous_sha=""
          if [ -f camera/source.sha256 ]; then previous_sha=$(cat camera/source.sha256); fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "$current_sha" > camera/source.sha256

      - name: Install Cartoon Mode renderer
        if: steps.source_frame.outputs.changed == 'true'
        run: python3 -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84

      - name: Apply locked Cartoon Mode
        if: steps.source_frame.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/privacy_blur_camera.py bellbrook-source.jpeg bellbrook-cartoon.jpeg --report cartoon-report.json
          test -s bellbrook-cartoon.jpeg
          cat cartoon-report.json

      - name: Downscale and publish Cartoon Mode latest frame
        if: steps.source_frame.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import cv2, json, pathlib
          img=cv2.imread("bellbrook-cartoon.jpeg")
          h,w=img.shape[:2]
          nw=640; nh=round(h*nw/w)
          img=cv2.resize(img,(nw,nh),interpolation=cv2.INTER_AREA)
          from datetime import datetime, timezone
          root=pathlib.Path("camera")
          frames=root/"frames"
          frames.mkdir(parents=True,exist_ok=True)
          cv2.imwrite(str(root/"latest.jpg"),img,[cv2.IMWRITE_JPEG_QUALITY,72])
          now=datetime.now(timezone.utc)
          # Preserve the real capture instant. Redundant schedules must not overwrite
          # different runs into the same synthetic 15-minute filename.
          stamp=now.strftime("%Y%m%dT%H%M%SZ")
          frame_path=frames/(stamp+".jpg")
          cv2.imwrite(str(frame_path),img,[cv2.IMWRITE_JPEG_QUALITY,68])
          pathlib.Path(root/"cartoon-report.json").write_text(pathlib.Path("cartoon-report.json").read_text())
          manifest={"updated_utc":stamp,"frames":[p.name for p in sorted(frames.glob("*.jpg"))]}
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          git config user.name "bellbrook-floodwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add camera/latest.jpg camera/cartoon-report.json camera/manifest.json camera/source.sha256 camera/frames
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Cartoon Mode Bellbrook camera frame"
          git pull --rebase origin main
          git push origin HEAD:main


