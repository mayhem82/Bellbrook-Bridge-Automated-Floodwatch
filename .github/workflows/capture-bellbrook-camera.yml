name: Bellbrook camera capture prototype

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-bellbrook-camera.yml'
      - 'scripts/privacy_blur_camera.py'

permissions:
  contents: write

concurrency:
  group: bellbrook-camera-capture
  cancel-in-progress: false

jobs:
  validate-current-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and validate Bellbrook Bridge JPEG
        shell: bash
        env:
          CAMERA_URL: https://public.disasterwatch-iotp.com.au/prospectpublicimages/1662/Bellbrook%20Bridge.jpeg
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            -H 'Accept: image/jpeg' \
            -H 'User-Agent: Bellbrook-Floodwatch/1.0' \
            -D headers.txt -o bellbrook-source.jpeg "$CAMERA_URL"

          bytes=$(stat -c '%s' bellbrook-source.jpeg)
          test "$bytes" -ge 10000
          test "$bytes" -le 5000000

          mime=$(file --brief --mime-type bellbrook-source.jpeg)
          test "$mime" = image/jpeg

          python3 - <<'PY'
          from pathlib import Path
          p = Path("bellbrook-source.jpeg")
          b = p.read_bytes()
          if not (b.startswith(b"\xff\xd8") and b.endswith(b"\xff\xd9")):
              raise SystemExit("Invalid JPEG markers")
          print(f"validated JPEG: {len(b)} bytes")
          PY

          sha256sum bellbrook-source.jpeg
          printf '\nHTTP response headers:\n'
          cat headers.txt

      - name: Install privacy detector
        run: |
          python3 -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84
          curl --fail --location --silent --show-error --max-time 30 \
            -o deploy.prototxt \
            https://raw.githubusercontent.com/chuanqi305/MobileNet-SSD/master/deploy.prototxt
          curl --fail --location --silent --show-error --max-time 60 \
            -o mobilenet.caffemodel \
            https://github.com/chuanqi305/MobileNet-SSD/raw/master/mobilenet_iter_73000.caffemodel

      - name: Apply mandatory people and vehicle blur
        run: |
          set -euo pipefail
          python3 scripts/privacy_blur_camera.py \
            bellbrook-source.jpeg bellbrook-private.jpeg \
            --proto deploy.prototxt \
            --model mobilenet.caffemodel \
            --report privacy-report.json
          test -s bellbrook-private.jpeg
          cat privacy-report.json

      - name: Downscale and publish privacy-processed latest frame
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import cv2, json, pathlib
          img=cv2.imread("bellbrook-private.jpeg")
          h,w=img.shape[:2]
          nw=640; nh=round(h*nw/w)
          img=cv2.resize(img,(nw,nh),interpolation=cv2.INTER_AREA)
          from datetime import datetime, timezone
          root=pathlib.Path("camera")
          frames=root/"frames"
          frames.mkdir(parents=True,exist_ok=True)
          cv2.imwrite(str(root/"latest.jpg"),img,[cv2.IMWRITE_JPEG_QUALITY,72])
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          cv2.imwrite(str(frames/(stamp+".jpg")),img,[cv2.IMWRITE_JPEG_QUALITY,68])
          pathlib.Path(root/"privacy-report.json").write_text(pathlib.Path("privacy-report.json").read_text())
          kept=sorted(frames.glob("*.jpg"))
          for old in kept[:-336]:
              old.unlink()
          manifest={"updated_utc":stamp,"frames":[p.name for p in sorted(frames.glob("*.jpg"))]}
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          PY
          git config user.name "bellbrook-floodwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add camera/latest.jpg camera/privacy-report.json camera/manifest.json camera/frames
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update privacy-processed Bellbrook camera frame"
          git pull --rebase
          git push
