name: Bellbrook camera capture prototype

# Disabled by design until Kempsey Shire Council confirms automated archival
# and derivative-timelapse reuse permission for the Bellbrook Bridge camera.
# This workflow can be run manually for endpoint/validation testing only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bellbrook-camera-capture
  cancel-in-progress: false

jobs:
  validate-current-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and validate Bellbrook Bridge JPEG
        shell: bash
        env:
          CAMERA_URL: https://public.disasterwatch-iotp.com.au/prospectpublicimages/1662/Bellbrook%20Bridge.jpeg
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            -H 'Accept: image/jpeg' \
            -H 'User-Agent: Bellbrook-Floodwatch/1.0' \
            -D headers.txt -o bellbrook-source.jpeg "$CAMERA_URL"

          bytes=$(stat -c '%s' bellbrook-source.jpeg)
          test "$bytes" -ge 10000
          test "$bytes" -le 5000000

          mime=$(file --brief --mime-type bellbrook-source.jpeg)
          test "$mime" = image/jpeg

          python3 - <<'PY'
          from pathlib import Path
          p = Path("bellbrook-source.jpeg")
          b = p.read_bytes()
          if not (b.startswith(b"\xff\xd8") and b.endswith(b"\xff\xd9")):
              raise SystemExit("Invalid JPEG markers")
          print(f"validated JPEG: {len(b)} bytes")
          PY

          sha256sum bellbrook-source.jpeg
          printf '\nHTTP response headers:\n'
          cat headers.txt

      - name: Install privacy detector
        run: |
          python3 -m pip install --disable-pip-version-check opencv-python-headless==4.10.0.84
          curl --fail --location --silent --show-error --max-time 30 \
            -o deploy.prototxt \
            https://raw.githubusercontent.com/chuanqi305/MobileNet-SSD/master/deploy.prototxt
          curl --fail --location --silent --show-error --max-time 60 \
            -o mobilenet.caffemodel \
            https://github.com/chuanqi305/MobileNet-SSD/raw/master/mobilenet_iter_73000.caffemodel

      - name: Apply mandatory people and vehicle blur
        run: |
          set -euo pipefail
          python3 scripts/privacy_blur_camera.py \
            bellbrook-source.jpeg bellbrook-private.jpeg \
            --proto deploy.prototxt \
            --model mobilenet.caffemodel \
            --report privacy-report.json
          test -s bellbrook-private.jpeg
          cat privacy-report.json

      - name: Do not persist camera imagery
        run: |
          echo "Validation only: the fetched frame is intentionally not uploaded,"
          echo "committed, archived, or republished by this workflow."
          echo "Future persistence is blocked until people and vehicles are blurred."
